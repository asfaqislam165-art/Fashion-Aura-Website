<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - Fashion Aura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <ul class="nav justify-content-center bg-dark p-2 fixed-top">
            <li class="nav-item">
                <a class="nav-link" href="index.html"><i class="bi bi-house-check-fill"></i> Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="index.html#about">About</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="index.html#collections"><i class="fa-solid fa-layer-group"></i>All Collections</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="cart.html">
                    <i class="fa-solid fa-basket-shopping"></i> 
                    Cart (<span id="cart-count">0</span>)
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="index.html#contact"><i class="bi bi-person-lines-fill"></i> Contact</a>
            </li>
            
             <li class="nav-item">
                <a class="nav-link" href="complain.html#complain" role="button"><i class="fa-solid fa-lock"></i>Complain</a>
            </li>
            <li class="nav-item">
                <a class="btn btn-light" href="login.html#login" role="button"><i class="fa-solid fa-lock"></i>Login</a>
            </li>


        </ul>
    </div>

    <!-- কার্ট কন্টেন্ট -->
    <div class="container mt-5 pt-5">
        <h2 class="text-center my-4">🛒 আমার কার্ট</h2>
        
        <!-- কার্ট আইটেম এখানে দেখাবে -->
        <div id="cart-items">
            <div class="text-center my-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2">কার্ট লোড হচ্ছে...</p>
            </div>
        </div>
        
        <!-- সামারি কার্ড -->
        <div class="card p-3 mt-3 shadow-sm">
            <h4>মোট টাকা: <span id="total">0</span> BDT</h4>
            <button class="btn btn-success btn-lg mt-2" onclick="checkout()">
                <i class="bi bi-bag-check"></i> অর্ডার কনফর্ম করুন
            </button>
            <a href="index.html" class="btn btn-outline-secondary mt-2">
                <i class="bi bi-arrow-left"></i> কেনাকাটা চালিয়ে যান
            </a>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
